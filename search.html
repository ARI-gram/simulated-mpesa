<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search — Simulated M-PESA</title>
    <link rel="stylesheet" href="css/search.css" />
    <!-- PWA -->
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="M-PESA" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
  </head>

  <body>
    <div class="search-page">
      <!-- SEARCH BAR -->
      <div class="search-bar-wrap">
        <button
          type="button"
          class="back-btn"
          onclick="goBack()"
          aria-label="Go back"
        >
          ‹
        </button>

        <div class="search-input-wrap">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="#22c55e"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>

          <input
            type="text"
            id="searchInput"
            placeholder="Search transactions, people, requests…"
            autocomplete="off"
            oninput="onSearchInput()"
            onkeydown="onSearchKey(event)"
          />

          <button
            type="button"
            class="clear-btn hidden"
            id="clearBtn"
            onclick="clearSearch()"
            aria-label="Clear"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="#8a8a8a"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- BODY -->
      <main class="search-main" id="searchMain">
        <!-- populated by JS -->
      </main>
    </div>

    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/session.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/pages/search.js"></script>

    <script>
      seedIfEmpty();
    </script>
  </body>
</html>
