<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm — Simulated M-PESA</title>
    <!-- PWA -->
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="M-PESA" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />

    <link rel="stylesheet" href="css/confirm.css" />
  </head>

  <body>
    <div class="confirm-page">
      <!-- HEADER -->
      <header class="page-header">
        <button
          type="button"
          class="back-btn"
          onclick="goBack()"
          aria-label="Go back"
        >
          ‹
        </button>
        <h1>Confirm</h1>
        <span class="header-spacer"></span>
      </header>

      <!-- CONFIRM CONTENT -->
      <main class="confirm-main">
        <div class="confirm-wrap">
          <!-- Avatar sits on top of the card -->
          <div class="confirm-avatar" id="confirmAvatar">??</div>

          <div class="confirm-card">
            <div class="confirm-card-head" id="confirmHead">
              Send money to mobile number
            </div>

            <div class="confirm-rows" id="confirmRows">
              <!-- populated by JS -->
            </div>
          </div>
        </div>
      </main>

      <!-- SEND BUTTON -->
      <div class="confirm-bottom">
        <button
          type="button"
          class="btn-send"
          id="sendBtn"
          onclick="handleSend()"
        >
          Send
        </button>
      </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/session.js"></script>
    <script src="js/pages/confirm.js"></script>
  </body>
</html>
